<style>
  :root {
    --bg: #050a06;
    --green: #39ff6a;
    --dim: #1f8f43;
    --red: #ff3b3b;
    --gold: #ffd166;
    --snow: #dff7e6;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 16px 24px;
    overflow: hidden;
    background: var(--bg);
    color: var(--green);
    font: 24px/1.3 "VT323", "Courier New", monospace;
    text-shadow: 0 0 6px rgba(57, 255, 106, .55);
  }

  /* CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px);
  }

  #snow {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* String of lights */
  #lights {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    justify-content: space-around;
    height: 28px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    border-top: 2px solid var(--dim);
    list-style: none;
  }

  #lights li {
    flex: none;
    width: 10px;
    height: 16px;
    margin-top: 5px;
    border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
    animation: twinkle 1.6s steps(2, jump-none) infinite;
  }

  #lights li:nth-child(3n + 1) { color: var(--red); }
  #lights li:nth-child(3n + 2) { color: var(--green); animation-delay: .5s; }
  #lights li:nth-child(3n)     { color: var(--gold); animation-delay: 1s; }

  @keyframes twinkle {
    from { opacity: 1; }
    to   { opacity: .25; }
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    max-height: 100%;
    margin-bottom: 16vh;
    overflow-y: auto;
  }

  .tree {
    margin: 0 0 16px;
    font: inherit;
    line-height: 1;
    text-align: center;
    color: var(--green);
  }

  .tree .star { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
  .tree .bulb { color: var(--red); text-shadow: 0 0 8px var(--red); }
  .tree .trunk { color: #b5793c; text-shadow: none; }

  form {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  label { display: block; margin-bottom: 1.3em; text-align: center; }

  .prompt { flex: none; color: var(--red); text-shadow: 0 0 6px rgba(255, 59, 59, .6); }

  textarea {
    display: block;
    flex: 1;
    min-width: 0;
    padding: 0;
    overflow: hidden;
    resize: none;
    border: 0;
    outline: 0;
    border-radius: 0;
    background: transparent;
    color: var(--green);
    caret-color: var(--green);
    font: inherit;
    text-shadow: inherit;

    from { clip-path: inset(0 0 100% 0); }
    to   { clip-path: inset(0); }
  }

  /* Visible to screen readers only */
  #output.announce {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: 0;
    overflow: hidden;
    clip-path: inset(50%);
  }

  body.revealed .tree,
  body.revealed label,
  body.revealed form { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #lights li,
    #output.denied { animation: none; }
    #snow { display: none; }

<script>
  // Must match normalize(), checksum() and the key derivation in encrypt.py
  const ALPHABET = "abcdefghijklmnopqrstuvwxyz0123456789 ";
  const FIELD = 101; // Prime, and larger than the longest passphrase
  const MAX_ERRORS = 3;
  const CHECK_SIZE = MAX_ERRORS * 2;

  const normalize = (text) =>
    text
      .normalize("NFD")
      .toLowerCase()
      .replace(/\s+/g, " ")
      .replace(/[^a-z0-9 ]/g, "")
      .replace(/ +/g, " ")
      .trim();

  const fromBase64 = (text) => Uint8Array.from(atob(text), (char) => char.charCodeAt(0));
  const toBase64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));

  function power(base, exponent) {
    let result = 1;
    for (let i = 0; i < exponent; i++) result = (result * base) % FIELD;
    return result;
  }

  function checksum(symbols) {
    return Array.from({ length: CHECK_SIZE }, (_, j) =>
      symbols.reduce((sum, symbol, i) => (sum + symbol * power(i + 1, j + 1)) % FIELD, 0)
    );
  }

  function* subsets(length, size, start = 0) {
    if (size === 0) {
      yield [];
      return;
    }
    for (let i = start; i < length; i++) {
      for (const rest of subsets(length, size - 1, i + 1)) yield [i, ...rest];
    }
  }

  // Solves for the error at each position by Gauss-Jordan elimination modulo FIELD
  function errorsAt(positions, difference) {
    const rows = positions.map((_, j) => [
      ...positions.map((position) => power(position + 1, j + 1)),
      difference[j],
    ]);
    rows.forEach((row, pivot) => {
      const inverse = power(row[pivot], FIELD - 2);
      rows[pivot] = row.map((value) => (value * inverse) % FIELD);
      rows.forEach((other, r) => {
        if (r === pivot) return;
        const factor = other[pivot];
        rows[r] = other.map((value, c) => (value + (FIELD - factor) * rows[pivot][c]) % FIELD);
      });
    });
    return rows.map((row) => row[positions.length]);
  }

  // Returns the passphrase within MAX_ERRORS characters of the typed phrase, if any
  function repair(typed, check) {
    const symbols = [...typed].map((char) => ALPHABET.indexOf(char));
    const difference = checksum(symbols).map((value, j) => (value + FIELD - check[j]) % FIELD);

    for (let size = 0; size <= MAX_ERRORS; size++) {
      for (const positions of subsets(symbols.length, size)) {
        const errors = errorsAt(positions, difference);
        const matches = difference.every((value, j) =>
          positions.reduce((sum, position, e) => (sum + errors[e] * power(position + 1, j + 1)) % FIELD, 0) === value
        );
        if (!matches) continue;

        const fixed = [...symbols];
        positions.forEach((position, e) => {
          fixed[position] = (fixed[position] + FIELD - errors[e]) % FIELD;
        });
        if (fixed.every((symbol) => symbol < ALPHABET.length)) {
          return fixed.map((symbol) => ALPHABET[symbol]).join("");
        }
      }
    }
    return undefined;
  }

  async function unlock(typed) {
    for (const [id, entry] of Object.entries(ENCRYPTED.messages)) {
      if (entry.length !== typed.length) continue;
      const passphrase = repair(typed, entry.check);
      if (passphrase === undefined) continue;

      const secret = new TextEncoder().encode(passphrase);
      const material = await crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", hash: "SHA-256", salt: fromBase64(ENCRYPTED.salt), iterations: ENCRYPTED.iterations },
        material,
        256
      );
      if (toBase64(await crypto.subtle.digest("SHA-256", bits)) !== id) continue;

      const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(entry.iv) },
        key,
        fromBase64(entry.data)
      );
      return new TextDecoder().decode(plain);
    }
    return undefined;
  }

  const form = document.getElementById("login");
  const input = document.getElementById("passphrase");
  const output = document.getElementById("output");
  const reveal = document.getElementById("reveal");
  const giverName = document.getElementById("giver");
  const givesTo = document.getElementById("gives");
  const recipientName = document.getElementById("recipient");

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const NOISE = "!<>-_/[]{}=+*^?#@$%&01";

  // Resolves one letter at a time out of random characters
  async function decode(element, text) {
    const letters = [...text];
    element.classList.remove("pending");
    for (let frame = 0; frame <= letters.length * 3; frame++) {
      const solved = Math.floor(frame / 3);
      element.textContent = letters
        .map((char, i) => (i < solved || char === " " ? char : NOISE[Math.floor(Math.random() * NOISE.length)]))
        .join("");
      await wait(35);
    }
  }

  async function celebrate(giver, recipient) {
    if (!reducedMotion) {
      blizzard = 6;
      for (let i = 0; i <= 20; i++) {
        output.textContent = `DECRYPTING [${"#".repeat(i)}${".".repeat(20 - i)}] ${i * 5}%`;
        await wait(60);
      }
      output.textContent = "ACCESS GRANTED";
      await wait(600);
    }

    document.body.classList.add("revealed");
    output.className = "announce";
    output.textContent = "";
    giverName.textContent = giver;
    recipientName.textContent = recipient;
    reveal.hidden = false;

    if (!reducedMotion) {
      giverName.classList.add("pending");
      givesTo.classList.add("pending");
      recipientName.classList.add("pending");
      await decode(giverName, giver);
      await wait(250);
      givesTo.classList.remove("pending");
      await wait(450);
      await decode(recipientName, recipient);
      blizzard = 1;
    }

    output.textContent = `${giver} gives to ${recipient}`;
  }

  let attempts = 0;

  // Grows the input as its text wraps
  function fitInput() {
    input.style.height = "auto";
    input.style.height = `${input.scrollHeight}px`;
  }

  input.addEventListener("input", fitInput);
  window.addEventListener("resize", fitInput);

  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.isComposing) return;
    event.preventDefault();
    form.requestSubmit();
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const passphrase = normalize(input.value);
    if (passphrase === "" || input.disabled) return;

    attempts++;
    input.value = "";
    fitInput();
    input.disabled = true;
    output.className = "busy";
    output.textContent = "Decrypting...";

    const message = await unlock(passphrase);
    if (message === undefined) {
      void output.offsetWidth; // Forces a reflow so the animation restarts on every failure
      output.className = "denied";
      output.textContent =
        attempts > 1 && passphrase === "camila"
          ? "🚨 🚨 🚨 Pinche perro metiche 🚨 🚨 🚨"
          : "Jojojo, esa no es la contraseña. Inténtalo otra vez.";
      input.disabled = false;
      input.focus();
      return;
    }

    const [giver, recipient] = JSON.parse(message);
    await celebrate(giver, recipient);
  });

  const lights = document.getElementById("lights");
  for (let i = 0; i < 40; i++) lights.append(document.createElement("li"));

  // Snow
  const canvas = document.getElementById("snow");
  const context = canvas.getContext("2d");
  let flakes = [];
  let blizzard = 1;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    flakes = Array.from({ length: Math.ceil(canvas.width / 16) }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 0.4 + Math.random() * 1.2,
      drift: Math.random() * Math.PI * 2,
    }));
  }

  function snow() {
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--snow");
    context.font = '20px "VT323", monospace';
    for (const flake of flakes) {
      flake.y += flake.speed * blizzard;
      flake.drift += 0.01;
      if (flake.y > canvas.height) flake.y = -10;
      context.fillText("*", flake.x + Math.sin(flake.drift) * 12, flake.y);
    }
    requestAnimationFrame(snow);
  }

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    window.addEventListener("resize", resize);
    resize();
    snow();
  }
</script>
